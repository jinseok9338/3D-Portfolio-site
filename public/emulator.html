<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GBA Emulator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script>
    // EmulatorJS 설정
    EJS_player = '#game';
    EJS_gameUrl = '/roms/goodboy-galaxy.gba';
    EJS_core = 'gba';
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    EJS_startOnLoaded = true;
    EJS_DEBUG_XX = false;
    EJS_disableDatabaseRecovery = true;
    EJS_language = 'en';

    // 가상 게임패드 활성화 (EmulatorJS 기본 패드 사용)
    EJS_VirtualGamepadSettings = {
      opacity: 0.5,
      scale: 1,
    };
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
